name: Sync Docker Images
run-name: Sync ${{ inputs.source_repo }} to ${{ inputs.destination_scope }}
on: 
  workflow_dispatch:
    inputs:
      source:
        description: '镜像源 (Registry)'     
        required: true
        default: 'docker.io'
      destination:
        description: '目标源 (Registry)'
        required: true
        default: 'registry.cn-beijing.aliyuncs.com'
      source_repo:
        description: '仓库 (格式 repo)'
        required: true
        default: ''
      destination_scope:
        description: '目标Scope (格式 scope)'
        required: true
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Sync Docker Images
      shell: bash
      env:
        SOURCE: ${{ github.event.inputs.source }}
        SOURCE_CREDENTIAL: ${{ secrets.SOURCE_CREDENTIAL }}
        DESTINATION: ${{ github.event.inputs.destination }}
        DESTINATION_CREDENTIAL: ${{ secrets.DESTINATION_CREDENTIAL }}
        SYNC: "${{ github.event.inputs.source_repo }} ${{ github.event.inputs.destination_scope }}"
      run: bash .github/scripts/docker-sync.sh
